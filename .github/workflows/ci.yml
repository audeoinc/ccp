name: CI

# プルリクエストと main への push のたびに、検証を行う(main を、常に反映できる状態に保つ)。
# 本番への反映は、ここでは行わない(gcloud のサインインが必要なため)。反映は npm run deploy:gcp。

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Schema (server/schema.json vs. src/models and src/data)
        run: node scripts/check-schema.mjs
      - name: Type check
        run: npx tsc -b
      - name: Lint
        run: npx eslint .
      - name: Build
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Server dependencies
        run: pip install -r server/requirements.txt -r server/requirements-hosted.txt
      - name: Server tests
        run: python -m unittest discover server/tests
