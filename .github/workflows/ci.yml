name: CI

# プルリクエストと main への push のたびに、検証を行う(main を、常に反映できる状態に保つ)。
# 本番への反映は、ここでは行わない(gcloud のサインインが必要なため)。反映は npm run deploy:gcp。

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Schema (server/schema.json vs. src/models and src/data)
        run: node scripts/check-schema.mjs
      - name: Type check
        run: npx tsc -b
      - name: Lint
        run: npx eslint .
      - name: Build
        run: npm run build
      # 画面とサーバーで同じ判定になるかの確かめ(npm run verify に含むものを、CI でも)
      - name: Approvals and policy checks
        run: |
          node scripts/check-approvals.mjs
          node scripts/check-policy.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Server dependencies
        run: pip install -r server/requirements.txt -r server/requirements-hosted.txt
      # server の中で流す(テストの多くは ccp を、server を起点に読み込む。HANDOVER の「動かし方」と同じ流し方)
      - name: Server tests
        working-directory: server
        run: python -m unittest discover -s tests
      # Workbench 版と同じく、ccp/hosted/ と、その依存(requirements-hosted.txt)がなくても、サーバーが読み込めてテストが通るか
      # (hosted が読めないと黙って切り替わるので、外のコードが hosted に頼っていても、ここで見つける)
      - name: Server without hosted
        working-directory: server
        run: |
          python -m venv /tmp/nohosted
          /tmp/nohosted/bin/pip install -q -r requirements.txt
          mv ccp/hosted /tmp/ccp-hosted
          mv tests/test_hosted_dbctl.py /tmp/
          /tmp/nohosted/bin/python -c "import ccp.main; assert ccp.main.hosted_router is None"
          /tmp/nohosted/bin/python -m unittest discover -s tests
